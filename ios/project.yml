name: CodeSocket
options:
  bundleIdPrefix: app.codesocket
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AnyProvCore:
    path: AnyProvCore
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.2.0
  # On-device Metal chat (MLX). Coding sessions never use these products.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  CodeSocket:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    dependencies:
      - package: AnyProvCore
      - package: MarkdownUI
        product: MarkdownUI
      - package: Highlightr
        product: Highlightr
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.codesocket.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Persist across xcodegen regenerate (otherwise Signing & Capabilities clears).
        DEVELOPMENT_TEAM: 4JBMBNGPK7
        CODE_SIGN_IDENTITY: "iPhone Developer"
        # MLX / Metal needs the increased default stack on device.
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
    entitlements:
      path: App/CodeSocket.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "CodeSocket"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Local-network dev tool: allow cleartext to the desktop server on your
        # LAN (http:// pairing and ws:// streaming). Tighten for App Store.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Connect to your desktop coding server on the local network."
        NSCameraUsageDescription: "Scan pairing QR codes and capture photos for Vision analysis."
        # Required for NWBrowser to discover `_codesocket._tcp` (desktop Bonjour).
        NSBonjourServices:
          - "_codesocket._tcp"
        NSHealthShareUsageDescription: "CodeSocket reads your Apple Health data when you turn on Health in chat, so the assistant can answer questions about steps, sleep, workouts, and other stats you choose to share."
        NSHealthUpdateUsageDescription: "CodeSocket does not write to Apple Health. This permission is required by the system HealthKit entitlement."
        NSLocationWhenInUseUsageDescription: "CodeSocket uses your location when you turn on Location in chat, so the assistant can answer with local context such as nearby places, weather, and time zone."
