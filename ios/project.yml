name: RoamSocket
options:
  bundleIdPrefix: app.roamsocket
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AnyProvCore:
    path: AnyProvCore
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.2.0
  # On-device Metal chat (MLX). Coding sessions never use these products.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

targets:
  RoamSocket:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: Shared
    dependencies:
      - package: AnyProvCore
      - package: MarkdownUI
        product: MarkdownUI
      - package: Highlightr
        product: Highlightr
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
      - target: RoamSocketWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roamsocket.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Persist across xcodegen regenerate (otherwise Signing & Capabilities clears).
        DEVELOPMENT_TEAM: 4JBMBNGPK7
        CODE_SIGN_IDENTITY: "iPhone Developer"
        # MLX / Metal needs the increased default stack on device.
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
    entitlements:
      path: App/RoamSocket.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "RoamSocket"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Universal (iPhone + iPad): declare orientations explicitly. iPad apps
        # must support all four unless UIRequiresFullScreen is true.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Local-network dev tool: allow cleartext to the desktop server on your
        # LAN (http:// pairing and ws:// streaming). Tighten for App Store.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Connect to your desktop coding server on the local network."
        NSCameraUsageDescription: "Scan pairing QR codes and capture photos for Vision analysis."
        # Required by PHPicker / PHAsset on iOS for the Gallery button. Even
        # though PHPicker runs out-of-process, the OS prompts the first time
        # the user opens the system photo picker for this app.
        NSPhotoLibraryUsageDescription: "Pick photos from your library to attach to a chat for Vision analysis."
        # Required for NWBrowser to discover `_roamsocket._tcp` (desktop Bonjour).
        # LEGACY: `_roamsocket._tcp` only so older desktops still advertising that type are found.
        NSBonjourServices:
          - "_roamsocket._tcp"
          - "_roamsocket._tcp"
        NSHealthShareUsageDescription: "RoamSocket reads your Apple Health data when you turn on Health in chat, so the assistant can answer questions about steps, sleep, workouts, and other stats you choose to share."
        NSHealthUpdateUsageDescription: "RoamSocket does not write to Apple Health. This permission is required by the system HealthKit entitlement."
        NSLocationWhenInUseUsageDescription: "RoamSocket uses your location when you turn on Location in chat, so the assistant can answer with local context such as nearby places, weather, and time zone."
        NSMicrophoneUsageDescription: "RoamSocket uses the microphone for live voice chat so you can talk to the model with dictation."
        NSSpeechRecognitionUsageDescription: "RoamSocket uses on-device speech recognition to turn your speech into chat messages during voice conversations."
        # Deep links for App Intents / Control Center / Action Button.
        CFBundleURLTypes:
          - CFBundleURLName: app.roamsocket.open
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - roamsocket
        # Live Activity while Chat / Code / Vision is waiting on a model.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false

  RoamSocketWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roamsocket.app.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 4JBMBNGPK7
        CODE_SIGN_IDENTITY: "iPhone Developer"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
        # Widget extension can use iOS 17 APIs; Control Widgets gate on iOS 18+.
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: "RoamSocket"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true

  # Unit tests for the iOS app target. Anything that touches UIKit / ImageIO
  # lives here (not in AnyProvCore, which is platform-agnostic). Run with
  # `xcodebuild test -scheme RoamSocket -destination 'platform=iOS Simulator'`.
  RoamSocketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Sources/Features/Chat/ImageProcessing.swift
      - path: App/Tests
    dependencies:
      - target: RoamSocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.roamsocket.app.tests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: 4JBMBNGPK7
        CODE_SIGN_IDENTITY: "iPhone Developer"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RoamSocket.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RoamSocket"
