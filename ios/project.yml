name: AnyProvCode
options:
  bundleIdPrefix: com.anyprovcode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AnyProvCore:
    path: AnyProvCore

targets:
  AnyProvCode:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    dependencies:
      - package: AnyProvCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anyprovcode.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: App/AnyProvCode.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "AnyProv Code"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Local-network dev tool: allow cleartext to the desktop server on your
        # LAN (http:// pairing and ws:// streaming). Tighten for App Store.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Connect to your desktop coding server on the local network."
        NSHealthShareUsageDescription: "AnyProv Code reads your Apple Health data when you turn on Health in chat, so the assistant can answer questions about steps, sleep, workouts, and other stats you choose to share."
        NSHealthUpdateUsageDescription: "AnyProv Code does not write to Apple Health. This permission is required by the system HealthKit entitlement."
