<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:* http://127.0.0.1:4319 http://localhost:4319;" />
    <title>AnyProv Code</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">AP</div>
          <div class="brand-text">
            <div class="brand-title">AnyProv Code</div>
            <div class="brand-sub" id="server-status">starting…</div>
          </div>
        </div>
        <nav class="nav">
          <a href="#/home" data-route="home">Home</a>
          <a href="#/history" data-route="history">History</a>
          <a href="#/settings" data-route="settings">Settings</a>
        </nav>
        <div class="pairing-card">
          <div class="pairing-label">Pairing code</div>
          <div class="pairing-code" id="pairing-code">------</div>
          <button class="ghost-btn" id="copy-code">Copy</button>
        </div>
      </aside>

      <main class="content">
        <header class="mobile-topbar">
          <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <div class="mobile-topbar-title">Code</div>
        </header>
        <div class="content-scroll">
          <section id="view-home" class="view"></section>
          <section id="view-history" class="view hidden"></section>
          <section id="view-settings" class="view hidden"></section>
        </div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
