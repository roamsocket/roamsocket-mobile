<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:* http://127.0.0.1:4319 http://localhost:4319;" />
    <title>Code Mobile AI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Top safety banner. Shown by the renderer once we know the user
         hasn't acknowledged a recent session. Pure decoration for now;
         the renderer can hide it via a click handler. -->
    <div class="top-banner" id="top-banner" hidden>
      <span class="dot"></span>
      <span class="msg">For your security, sign in again to keep using Code Mobile AI.</span>
      <button class="banner-cta" id="banner-cta" type="button">Sign in again</button>
    </div>

    <div id="app">
      <!-- ───── Sidebar ───── -->
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="tabs" role="tablist">
            <button class="tab active" data-tab="home" type="button">
              <span class="tab-icon" aria-hidden="true">⌂</span>
              <span>Home</span>
            </button>
            <button class="tab" data-tab="code" type="button">
              <span class="tab-icon" aria-hidden="true">&lt;/&gt;</span>
              <span>Code</span>
            </button>
          </div>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-item primary" data-action="new" type="button">
            <span class="nav-icon" aria-hidden="true">+</span>
            <span>New chat</span>
          </button>
        </nav>

        <div class="recents">
          <div class="recents-head">
            <span>Recents</span>
            <button class="icon-btn" id="recents-filter" type="button" title="Sort">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M4 8h8M6 12h4"/></svg>
            </button>
          </div>
          <div class="recents-list" id="recents-list">
            <!-- populated by main.ts -->
          </div>
        </div>

        <div class="sidebar-bottom">
          <div class="update-card" id="update-card" hidden>
            <span class="leaf">🍃</span>
            <div class="update-meta">
              <div class="update-title">Relaunch to update</div>
              <div class="update-version" id="update-version">v—</div>
            </div>
            <button class="update-cta" type="button" aria-label="Relaunch">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
            </button>
          </div>

          <div class="sidebar-actions">
            <button class="text-btn" data-action="open-settings" type="button">
              <span class="nav-icon" aria-hidden="true">⚙</span>
              <span>Settings</span>
            </button>
          </div>

          <button class="user-chip" type="button" id="user-chip">
            <span class="avatar" id="user-avatar">JS</span>
            <span class="user-name" id="user-name">JC</span>
            <span class="user-plan">Pro</span>
            <svg class="chev" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6l4 4 4-4"/></svg>
          </button>
        </div>
      </aside>

      <!-- ───── Main ───── -->
      <main class="main">
        <header class="main-header">
          <div class="crumbs" id="crumbs">
            <span class="crumb-tab">Home</span>
          </div>
        </header>

        <!-- Home view: large greeting + single composer pill -->
        <section class="view" id="view-home">
          <div class="hero">
            <h1 class="greeting">
              <span class="greeting-icon" aria-hidden="true">✻</span>
              <span id="greeting-text">Hello, JC</span>
            </h1>
          </div>
          <div class="composer-wrap home-composer">
            <!-- composer rendered here -->
          </div>
          <div class="home-disclaimer">Code Mobile AI can make mistakes. Please double-check cited sources.</div>
        </section>

        <!-- Code view: repo/model pickers + session + composer -->
        <section class="view hidden" id="view-code">
          <!-- populated by main.ts -->
        </section>
      </main>
    </div>

    <!-- ───── Settings modal overlay ───── -->
    <div class="modal-backdrop hidden" id="settings-backdrop"></div>
    <div class="modal hidden" id="settings-modal" role="dialog" aria-modal="true" aria-label="Settings">
      <button class="modal-close" id="settings-close" type="button" aria-label="Close">×</button>
      <div class="modal-search">
        <span class="search-icon">�</span>
        <input id="settings-search" type="text" placeholder="Search settings" autocomplete="off" />
      </div>
      <div class="modal-body">
        <nav class="modal-nav" id="settings-nav">
          <div class="nav-group-label">Settings</div>
          <button class="modal-nav-item active" data-section="general" type="button">
            <span class="mni-icon">⚙</span>General
          </button>
          <button class="modal-nav-item" data-section="providers" type="button">
            <span class="mni-icon">⌬</span>Providers
          </button>
          <button class="modal-nav-item" data-section="github" type="button">
            <span class="mni-icon">⌥</span>GitHub
          </button>
          <button class="modal-nav-item" data-section="pairing" type="button">
            <span class="mni-icon">⇄</span>Pairing
          </button>
          <button class="modal-nav-item" data-section="window" type="button">
            <span class="mni-icon">▢</span>Window
          </button>

          <div class="nav-group-label">About</div>
          <button class="modal-nav-item" data-section="about" type="button">
            <span class="mni-icon">ⓘ</span>About
          </button>
        </nav>
        <div class="modal-panel" id="settings-panel">
          <!-- section content rendered by main.ts -->
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
