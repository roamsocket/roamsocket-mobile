<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: http: https:;"
    />
    <title>RoamSocket</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <script>
      // Apply before paint so macOS traffic lights don't cover the brand on first frame.
      if (/Mac/i.test(navigator.platform) || /Mac OS X/i.test(navigator.userAgent)) {
        document.body.classList.add("platform-darwin");
      }
    </script>
    <div id="app" class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand-mark" aria-hidden="true">CS</div>
          <div class="brand-copy">
            <div class="brand-title">RoamSocket</div>
            <div class="brand-sub" id="server-status">starting…</div>
          </div>
        </div>

        <button type="button" class="new-chat-btn" id="btn-new-chat">
          <span class="plus" aria-hidden="true">+</span>
          New
        </button>

        <nav class="nav" id="main-nav" aria-label="Primary">
          <a href="#/chats" data-route="chats" class="nav-item active">
            <span class="nav-icon" aria-hidden="true">◎</span>
            Chats
          </a>
          <a href="#/projects" data-route="projects" class="nav-item">
            <span class="nav-icon" aria-hidden="true">▦</span>
            Projects
          </a>
          <a href="#/artifacts" data-route="artifacts" class="nav-item">
            <span class="nav-icon" aria-hidden="true">⧉</span>
            Artifacts
          </a>
          <a href="#/code" data-route="code" class="nav-item">
            <span class="nav-icon" aria-hidden="true">&lt;/&gt;</span>
            Code
          </a>
        </nav>

        <div class="recents-block">
          <div class="recents-label-row">
            <span class="recents-label">Recents</span>
          </div>
          <div class="recents-list" id="recents-list"></div>
        </div>

        <div class="sidebar-footer">
          <div class="pairing-mini">
            <div class="pairing-label">Pairing code</div>
            <div class="pairing-code" id="pairing-code">------</div>
            <button type="button" class="ghost-btn sm" id="copy-code">Copy</button>
          </div>
          <button type="button" class="settings-btn" id="btn-settings" title="Settings" aria-label="Settings">
            <svg class="settings-cog" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
            </svg>
          </button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <div class="topbar-crumbs" id="topbar-crumbs">
            <span class="topbar-title" id="topbar-title">New chat</span>
          </div>
          <div class="topbar-actions" id="topbar-actions"></div>
        </header>
        <div class="content-scroll">
          <section id="view-chats" class="view"></section>
          <section id="view-projects" class="view hidden"></section>
          <section id="view-artifacts" class="view hidden"></section>
          <section id="view-code" class="view hidden"></section>
          <section id="view-settings" class="view hidden"></section>
          <section id="view-metal" class="view hidden"></section>
        </div>
      </main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
